version: 1
meta:
  description: Crush, the Charmbracelet terminal coding agent
extends:
  - defaults
  - mise
command: ["crush"]
tools:
  crush: latest
mounts:
  ~/.config/AGENTS.md:
    source: ~/.config/AGENTS.md
  ~/.config/crush:
    source: ~/.config/crush
    create: true
  ~/.local/share/crush:
    source: ~/.local/share/crush
    create: true
    read_only: false
