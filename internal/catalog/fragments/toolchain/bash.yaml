version: 1
meta:
  description: Bash shell config mounts and shellcheck
tools:
  shellcheck: latest
mounts:
  ~/.bashrc:
    source: ~/.bashrc
  ~/.bash_profile:
    source: ~/.bash_profile
  ~/.bash_aliases:
    source: ~/.bash_aliases
  ~/.profile:
    source: ~/.profile
  ~/.inputrc:
    source: ~/.inputrc
packages:
  - bash
