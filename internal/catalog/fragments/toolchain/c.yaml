version: 1
meta:
  description: C toolchain (gcc, clang, make, cmake, ninja)
packages:
  - clang
  - cmake
  - gcc
  - gdb
  - make
  - mold
  - ninja-build
  - pkgconf
tools:
  sccache: latest
caches:
  sccache: ~/.cache/sccache
environment:
  CC: sccache gcc
  CXX: sccache g++
  LDFLAGS: -fuse-ld=mold
